<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Athena</title>
  <meta name="theme-color" content="#123E52">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png') }}" sizes="32x32">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      color-scheme: light;
      background: #f4ecdd;
      color: #173442;
      font-family: Georgia, serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fffaf0;
      border: 1px solid #d6c6ab;
      border-radius: 2px;
      padding: 40px 36px;
      width: min(380px, 92vw);
      text-align: center;
    }

    .card img { width: 56px; height: 56px; border-radius: 12px; }
    .card h1 { font-size: 18px; font-weight: 500; margin: 18px 0 8px; }
    .card p { color: #4d6670; line-height: 1.5; }

    .retry {
      margin-top: 24px;
      background: #123e52;
      color: #fffaf0;
      border: 0;
      border-radius: 8px;
      padding: 10px 20px;
      font: inherit;
      cursor: pointer;
    }
    .retry:hover { background: #0a2f42; }
  </style>
</head>
<body>
  <div class="card">
    <img src="{{ url_for('static', filename='icons/icon-192.png') }}" alt="">
    <h1>You're offline</h1>
    <p>Athena needs a connection to load your list. Reconnect and try again.</p>
    <button class="retry" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
